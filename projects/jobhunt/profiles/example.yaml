# Hard eligibility constraints. Postings that trip these get flagged and, with
# `--hide-blocked`, filtered out of the dashboard entirely.
# Set to false any that do not apply to you.
dealbreakers:
  us_citizenship_required: false    # flag jobs demanding US citizenship
  active_clearance_required: false  # flag jobs demanding an existing clearance
  no_sponsorship: false             # flag jobs that state they will not sponsor

min_salary: null   # e.g. 75000 to suppress anything advertised below that

# -----------------------------------------------------------------------------
# SOURCES
# -----------------------------------------------------------------------------
sources:
  # Free, unlimited. Polls company ATS boards directly - highest signal.
  ats_boards:
    enabled: true

  # Free federal jobs API. US only - skipped automatically in other regions.
  # Key in ~2 min: https://developer.usajobs.gov/apirequest
  usajobs:
    enabled: true
    keyword_limit: 8       # how many of your title queries to send
    results_per_page: 50

  # UN OCHA's humanitarian board. Worldwide, free, and the single best source
  # for disaster risk / recovery / resilience work outside the US.
  # Register a free appname: https://apidoc.reliefweb.int/parameters#appname
  reliefweb:
    enabled: true
    limit_per_query: 40
    use_region_country: true   # false = search worldwide regardless of region
    queries:
      - disaster risk reduction
      - emergency management
      - resilience
      - recovery
      - climate adaptation
      - monitoring evaluation research

  # 20 countries, free key: https://developer.adzuna.com/signup
  # Skipped automatically in regions Adzuna does not serve (e.g. the Gulf).
  adzuna:
    enabled: true
    max_queries: 8
    limit_per_query: 50

  # Free remote-jobs feed, no key.
  remotive:
    enabled: true
    queries: [research analyst, policy analyst, climate, data analyst]

  # Remote roles worldwide, no key. Skews heavily toward remote tech, so the
  # queries are kept narrow - broad ones ("management", "marketing") pull in
  # a few hundred engineering roles that score near zero anyway.
  jobicy:
    enabled: true
    queries: [research, data]
    geo: ""                # e.g. europe, usa, asia - blank means anywhere

  # Germany and wider Europe, no key. Only worth running in European regions.
  arbeitnow:
    enabled: true
    queries: [research, analyst, climate, sustainability, geospatial]

  # Off by default: The Muse indexes big-brand corporate employers, so it is
  # mostly noise for research and humanitarian work. Turn on if you retarget.
  themuse:
    enabled: false
    pages: 2
    queries: [analyst, research, policy]
    categories: ["Data and Analytics", "Science and Engineering"]

  # Apify - costs credits. The $5/mo free tier covers roughly 12k LinkedIn
  # results, which is far more than you need.
  linkedin:
    enabled: true
    actor: valig/linkedin-jobs-scraper
    limit_per_query: 40
    date_posted: r604800        # r86400 = 24h, r604800 = week, r2592000 = month
    max_queries: 10

  indeed:
    enabled: false             # 10x the cost of LinkedIn; turn on when needed
    actor: borderline/indeed-scraper
    limit_per_query: 25
    from_days: "7"
    max_queries: 4

# Monthly Apify spend ceiling. The app refuses to start a run that would
# exceed this. Apify's free plan gives you $5/month.
budget_usd_per_month: 4.0

# -----------------------------------------------------------------------------
# COMPANY WATCHLIST - polled free and unlimited, straight from each employer's
# ATS. You see a posting the hour it goes up, with the real apply link rather
# than a LinkedIn repost.
#
# HOW TO ADD ONE (30 seconds, and it always works):
#   1. Open the employer's careers page
#   2. Copy the URL
#   3. jobhunt watch add-url "https://boards.greenhouse.io/theirslug"
#
# The entries below were each verified against the board's own declared name,
# so they are real. The list is short on purpose: only Greenhouse, Lever,
# Ashby, Workable and Recruitee publish open board APIs. Most large hazards
# and federal-contractor employers - ICF, Guidehouse, Booz Allen, Tetra Tech
# US, AECOM, Dewberry, RAND - run on Workday, iCIMS or Taleo, which do not.
# Those employers are covered by the LinkedIn and USAJOBS sources instead, so
# nothing is actually lost; it just arrives by a different route.
# -----------------------------------------------------------------------------
watchlist:
  - {name: World Resources Institute, ats: greenhouse, slug: wri,            tags: climate research}
  - {name: Mercy Corps,               ats: workable,   slug: mercycorps,     tags: humanitarian}
  - {name: GiveDirectly,              ats: greenhouse, slug: givedirectly,   tags: development}
  - {name: Code for America,          ats: greenhouse, slug: codeforamerica, tags: civic policy}
