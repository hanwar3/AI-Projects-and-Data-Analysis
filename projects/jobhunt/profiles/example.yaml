# =============================================================================
# WHERE - region controls the whole geography of the search
# =============================================================================
# `jobhunt regions`                    see every region
# `jobhunt search --region uk`         search one without changing anything
# `jobhunt rescore --region uk`        re-rank what you already have for it
#
# Changing `active_region` below makes a region the default. After changing it,
# run `jobhunt rescore` so location scores are recalculated.
#
# Built in: us_dc, us, us_texas, canada, uk, europe, australia_nz, gulf,
#           south_asia, africa, global_remote, humanitarian_global
active_region: us_dc

# `locations` below applies to the ACTIVE region only; other regions use their
# own built-in lists. Leave it empty to use us_dc's defaults.
locations:
  - Washington, DC          
  - Virginia
  - Maryland
  - Remote
  - Texas
remote_ok: true

# Override any built-in region, or invent your own. Anything you leave out
# falls back to the preset.
regions:
  # Example: widen the DC search up the north-east corridor.
  # us_dc:
  #   locations: [Washington DC, Virginia, Maryland, Philadelphia, New York, Remote]

  # Example: a region that does not ship with the app.
  # geneva:
  #   label: "Switzerland - Geneva (UN hub)"
  #   locations: [Geneva, Switzerland, Remote]
  #   metro_terms: [geneva, genève, lausanne, bern, zurich]
  #   country: ch
  #   adzuna_country: ch
  #   linkedin_location: "Geneva, Switzerland"
  #   reliefweb_country: Switzerland
  #   sources: [ats, reliefweb, adzuna, remotive, jobicy, linkedin, indeed]

