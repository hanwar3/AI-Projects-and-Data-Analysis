[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gfdrr-me-governed-rag"
version = "0.1.0"
description = "Governed M&E Grant Portfolio RAG Platform aligned with GFDRR 2026-2030 & World Bank AMS 6.21A Classification Policy"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.4.0",
    "pandas>=2.1.0",
    "matplotlib>=3.8.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "httpx>=0.26.0",
    "streamlit>=1.32.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../gfdrr_corpus"]
